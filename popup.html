<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }
    #recordBtn { background: #e11d48; }
    #stopBtn { background: #334155; display: none; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <button id="recordBtn">● Start Recording</button>
  <button id="stopBtn">■ Stop & Export</button>
  <div id="status">Idle</div>
  <script src="popup.js"></script>
</body>
</html>
